name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # ⚠️ 2026-09-24 起后端走 Netlify 反代，不再是 supabase.co 直连。
          #
          # 为什么：`*.supabase.co` 在国内被按域名（TLS SNI）封锁 —— 握手阶段
          # 就被掐断，浏览器代码一行都还没跑。实测同一 IP 换个 SNI 立刻通，
          # 所以解法是「后端不动，换个域名把它挂出来」。
          # 反代规则写在 netlify.toml 的 /sb/*，实测国内直连 3/3 通。
          #
          # ⚠️ 这个地址【不是密钥】—— 它会被打进前端 JS，人人可见，
          #    所以直接写在这里；真正的密钥 VITE_SUPABASE_ANON_KEY 仍走 Secrets。
          #
          # ⚠️ 不要再改回 supabase.co，也不要指望 GitHub 里那个旧的
          #    VITE_SUPABASE_URL Secret —— 那个值现在【没有作用了】。
          VITE_SUPABASE_URL: https://ornate-lebkuchen-09cba5.netlify.app/sb
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
