name: Keep Supabase Alive

on:
  schedule:
    # 每天 UTC 12:00 运行（北京时间 20:00）
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://rdmrplrlyojwugcxbqmj.supabase.co/rest/v1/items?limit=1" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}")
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "Supabase is alive ✅"
          else
            echo "Supabase ping FAILED with status $STATUS ❌"
            exit 1
          fi
